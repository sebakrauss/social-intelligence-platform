# Foundation CI (TA §64). Runs the checks that exist today (Step 0 foundation, Step 2 database/RLS, Step 3
# job foundation); adapter, AI and end-to-end gates are added by the implementation steps that create them.
# No managed credentials are needed: the managed suites (test:db:managed, test:jobs:managed) run explicitly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Secret scan
        run: npm run secret-scan

      - name: Dependency audit
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency boundaries
        run: npm run boundaries

      - name: Unit and architecture tests
        run: npm run test

      # Disposable local PostgreSQL 17 (embedded, no secrets): migrations on a fresh database, schema
      # classification and grant introspection, T-26 isolation suite, T-27 job foundation suite (relay,
      # sweepers, R6/R7, switches; job runtime modeled by a test double), last-Owner concurrency, persistence.
      # The managed suites (npm run test:db:managed, test:jobs:managed) need local secrets and don't run here.
      - name: Database tests (local PostgreSQL)
        run: npm run test:db

      - name: Production build
        run: npm run build
