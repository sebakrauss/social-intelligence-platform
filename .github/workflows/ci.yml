# Foundation CI (TA §64). Runs the checks that exist today (Step 0 foundation, Step 2 database/RLS);
# job, adapter, AI and end-to-end gates are added by the implementation steps that create them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Secret scan
        run: npm run secret-scan

      - name: Dependency audit
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency boundaries
        run: npm run boundaries

      - name: Unit and architecture tests
        run: npm run test

      # Disposable local PostgreSQL 17 (embedded, no secrets): migrations on a fresh database, schema
      # classification and grant introspection, T-26 isolation suite, last-Owner concurrency, persistence.
      # The managed Supabase suite (npm run test:db:managed) needs local secrets and does not run here.
      - name: Database tests (local PostgreSQL)
        run: npm run test:db

      - name: Production build
        run: npm run build
